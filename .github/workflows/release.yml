name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # Fully explicit combos: mixing `include` with a second axis
      # (`variant: [lite, full]`) does NOT cross-product reliably.
      matrix:
        include:
          # ---- macOS (ad-hoc signed, both architectures) ----
          - { os: macos-14, target: aarch64-apple-darwin, arch: arm64, variant: lite }
          - { os: macos-14, target: aarch64-apple-darwin, arch: arm64, variant: full }
          - { os: macos-14, target: x86_64-apple-darwin, arch: x86_64, variant: lite }
          - { os: macos-14, target: x86_64-apple-darwin, arch: x86_64, variant: full }
          # ---- Windows ----
          - { os: windows-latest, target: x86_64-pc-windows-msvc, arch: x86_64, variant: lite }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, arch: x86_64, variant: full }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64, variant: lite }
          # Windows arm64 full: ffmpeg is BUILT FROM SOURCE (the only
          # prebuilt winarm64 ffmpeg segfaults at startup). See the
          # "Build ffmpeg from source" step below.
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, arch: arm64, variant: full }
          # ---- Linux ----
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: x86_64, variant: lite }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, arch: x86_64, variant: full }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64, variant: lite }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, arch: arm64, variant: full }

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.variant }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch prebuilt yt-dlp (+ffmpeg where available) sidecars (full variant)
        if: matrix.variant == 'full'
        run: bash scripts/fetch-tools.sh "${{ matrix.target }}"

      # Windows arm64 only: no usable prebuilt ffmpeg exists, so we compile a
      # minimal static build ourselves (GPLv3, yt-dlp-oriented feature set).
      - name: Set up MSYS2 CLANGARM64 (Windows arm64 ffmpeg build)
        if: matrix.variant == 'full' && matrix.target == 'aarch64-pc-windows-msvc'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: >-
            make
            diffutils
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-libmp3lame
            mingw-w64-clang-aarch64-libopus
            mingw-w64-clang-aarch64-libvorbis

      - name: Build ffmpeg from source (Windows arm64)
        if: matrix.variant == 'full' && matrix.target == 'aarch64-pc-windows-msvc'
        shell: msys2 {0}
        run: bash scripts/build-ffmpeg-winarm64.sh "${{ matrix.target }}"

      - name: Smoke-test sidecar binaries (full variant)
        if: matrix.variant == 'full'
        shell: bash
        run: |
          set -e
          EXT=""; case "${{ matrix.target }}" in *windows*) EXT=".exe";; esac
          "./src-tauri/binaries/yt-dlp-${{ matrix.target }}${EXT}" --version
          "./src-tauri/binaries/ffmpeg-${{ matrix.target }}${EXT}" -version | head -1
          "./src-tauri/binaries/ffprobe-${{ matrix.target }}${EXT}" -version | head -1

      - name: Build lite variant
        if: matrix.variant == 'lite'
        run: pnpm tauri build --target "${{ matrix.target }}"

      - name: Build full variant (bundled tools)
        if: matrix.variant == 'full'
        # NOTE: pass the config override as a FILE. Inline JSON loses its
        # quotes when pnpm forwards args on Windows runners.
        run: >-
          pnpm tauri build --target "${{ matrix.target }}"
          --config src-tauri/tauri.full.conf.json

      - name: Repackage macOS dmg with unsigned-app notice
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Video Downloader.app"
          OUT="Video-Downloader_${GITHUB_REF_NAME}_${{ matrix.variant }}_macos_${{ matrix.arch }}.dmg"
          bash scripts/make-dmg.sh "$APP" "$OUT"
          mkdir -p dist-release && mv "$OUT" dist-release/
          # keep the raw .app tarred as well for advanced users
          tar -C "src-tauri/target/${{ matrix.target }}/release/bundle/macos" \
            -czf "dist-release/Video-Downloader_${GITHUB_REF_NAME}_${{ matrix.variant }}_macos_${{ matrix.arch }}.app.tar.gz" \
            "Video Downloader.app"

      - name: Collect Windows artifacts
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p dist-release
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$B/nsis" -name '*.exe' -exec cp {} "dist-release/Video-Downloader_${GITHUB_REF_NAME}_${{ matrix.variant }}_windows_${{ matrix.arch }}-setup.exe" \;
          if [ "${{ matrix.variant }}" = "lite" ]; then
            # lite: single portable exe (sidecar-free by design)
            cp "src-tauri/target/${{ matrix.target }}/release/video-downloader.exe" \
              "dist-release/Video-Downloader_${GITHUB_REF_NAME}_lite_windows_${{ matrix.arch }}-portable.exe"
          else
            # full: a portable ZIP — the exe plus its sidecar tools together.
            # A bare exe can never be "full": Tauri sidecars live NEXT to the
            # exe, not inside it.
            P="portable-full"
            rm -rf "$P" && mkdir -p "$P"
            cp "src-tauri/target/${{ matrix.target }}/release/video-downloader.exe" "$P/"
            for tool in yt-dlp ffmpeg ffprobe; do
              cp "src-tauri/binaries/$tool-${{ matrix.target }}.exe" "$P/$tool.exe"
            done
            (cd "$P" && tar -a -c -f "../Video-Downloader_${GITHUB_REF_NAME}_full_windows_${{ matrix.arch }}-portable.zip" ./*)
            mv "Video-Downloader_${GITHUB_REF_NAME}_full_windows_${{ matrix.arch }}-portable.zip" dist-release/
          fi

      - name: Collect Linux artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist-release
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$B/appimage" -name '*.AppImage' -exec cp {} "dist-release/Video-Downloader_${GITHUB_REF_NAME}_${{ matrix.variant }}_linux_${{ matrix.arch }}.AppImage" \;
          find "$B/deb" -name '*.deb' -exec cp {} "dist-release/Video-Downloader_${GITHUB_REF_NAME}_${{ matrix.variant }}_linux_${{ matrix.arch }}.deb" \;

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
